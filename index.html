<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILD TOURISTS • JanitorAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0a; }
        .terminal-window { background: #111; border: 1px solid #333; }
        .section-title { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #888; }
        .timeline {
            position: relative;
            padding-left: 40px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 19px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(#333, #222);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 12px;
        }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-dot {
            position: absolute;
            left: 10px;
            top: 8px;
            width: 18px;
            height: 18px;
            background: #111;
            border: 3px solid #00f9ff;
            border-radius: 9999px;
            z-index: 2;
        }
        .timeline-branch {
            position: relative;
            margin-left: 32px;
            padding-left: 20px;
            border-left: 2px dashed #444;
        }
        .timeline-branch::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 10px;
            width: 20px;
            height: 2px;
            background: #444;
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-[#ddd]">
    <div class="max-w-[1480px] mx-auto">
        <div class="flex items-center justify-between px-6 py-4 border-b border-[#222]">
            <div class="flex items-center gap-x-3">
                <div class="w-8 h-8 bg-[#00f9ff] flex items-center justify-center rounded">
                    <i class="fa-solid fa-terminal text-black"></i>
                </div>
                <span class="font-bold text-2xl tracking-tight">WILD TOURISTS</span>
            </div>
            <button onclick="location.reload()" class="px-4 py-1.5 text-xs bg-[#1a1a1a] border border-[#333] rounded-3xl flex items-center gap-x-2">
                <i class="fa-solid fa-sync"></i> <span>RESET</span>
            </button>
        </div>

        <div class="p-6">
            <div id="upload-section" class="max-w-md mx-auto mt-10">
                <div class="terminal-window rounded-2xl p-8 text-center border border-[#333]">
                    <div class="text-[#00f9ff] text-5xl mb-4"><i class="fa-solid fa-upload"></i></div>
                    <h2 class="text-2xl font-semibold mb-2">Загрузи экспорт</h2>
                    <label class="cursor-pointer inline-block px-8 py-3 bg-[#00f9ff] text-black font-semibold rounded-2xl">
                        ВЫБРАТЬ JSON
                        <input type="file" id="json-upload" class="hidden" onchange="handleFileUpload(event)">
                    </label>
                </div>
            </div>

            <div id="dashboard" class="hidden">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="stat-card bg-[#111] border border-[#222] rounded-2xl p-5">
                        <div class="text-xs text-[#888]">ПЕРСОНАЖЕЙ</div>
                        <div id="stat-characters" class="text-4xl font-bold">—</div>
                    </div>
                    <div class="stat-card bg-[#111] border border-[#222] rounded-2xl p-5">
                        <div class="text-xs text-[#888]">ЧАТОВ</div>
                        <div id="stat-threads" class="text-4xl font-bold">—</div>
                    </div>
                    <div class="stat-card bg-[#111] border border-[#222] rounded-2xl p-5">
                        <div class="text-xs text-[#888]">СООБЩЕНИЙ</div>
                        <div id="stat-messages" class="text-4xl font-bold">—</div>
                    </div>
                    <div class="stat-card bg-[#111] border border-[#222] rounded-2xl p-5">
                        <div class="text-xs text-[#888]">С ДЕТАЛЯМИ</div>
                        <div id="stat-detailed" class="text-4xl font-bold">—</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
                    <div class="terminal-window rounded-2xl p-6 border border-[#222]">
                        <div class="section-title mb-4">ТОП ПЕРСОНАЖИ</div>
                        <div id="top-characters" class="space-y-1"></div>
                    </div>
                    <div class="terminal-window rounded-2xl p-6 border border-[#222]">
                        <div class="section-title mb-4">ТОП ПЕРСОНЫ</div>
                        <div id="top-personas" class="space-y-1"></div>
                    </div>
                </div>

                <div class="terminal-window rounded-2xl p-6 border border-[#222] mb-6">
                    <div class="section-title mb-4">АКТИВНОСТЬ ПО МЕСЯЦАМ</div>
                    <div class="h-72"><canvas id="activity-chart"></canvas></div>
                </div>

                <div class="terminal-window rounded-2xl p-6 border border-[#222]">
                    <div class="section-title mb-4">ВСЕ ПЕРСОНАЖИ</div>
                    <input type="text" id="search" placeholder="Поиск персонажа..." class="w-full bg-[#1a1a1a] border border-[#333] px-4 py-2 rounded mb-4" onkeyup="filterCharacters()">
                    <div id="characters-list" class="max-h-[500px] overflow-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal with proper tree -->
    <div id="modal" onclick="if(event.target.id==='modal') closeModal()" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
        <div onclick="event.stopImmediatePropagation()" class="terminal-window w-full max-w-4xl rounded-2xl border border-[#00f9ff]/40 max-h-[92vh] flex flex-col">
            <div class="px-6 py-4 border-b border-[#333] flex justify-between items-center">
                <div id="modal-title" class="text-2xl font-semibold"></div>
                <button onclick="closeModal()" class="text-3xl text-[#666] hover:text-white">×</button>
            </div>

            <div class="p-6 overflow-auto">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-[#0a0a0a] p-4 rounded-xl border border-[#222]">
                        <div class="text-xs text-[#888]">Тредов</div>
                        <div id="modal-threads" class="text-3xl font-bold"></div>
                    </div>
                    <div class="bg-[#0a0a0a] p-4 rounded-xl border border-[#222]">
                        <div class="text-xs text-[#888]">Сообщений</div>
                        <div id="modal-messages" class="text-3xl font-bold text-[#00f9ff]"></div>
                    </div>
                    <div class="bg-[#0a0a0a] p-4 rounded-xl border border-[#222]">
                        <div class="text-xs text-[#888]">Первый чат</div>
                        <div id="modal-first" class="font-mono text-sm"></div>
                    </div>
                    <div class="bg-[#0a0a0a] p-4 rounded-xl border border-[#222]">
                        <div class="text-xs text-[#888]">Последний чат</div>
                        <div id="modal-last" class="font-mono text-sm"></div>
                    </div>
                </div>

                <!-- Visual Tree -->
                <div>
                    <div class="section-title mb-3">ДЕРЕВО ЧАТОВ (хронология + ветки по персонам)</div>
                    <div id="visual-tree" class="timeline bg-[#0a0a0a] border border-[#222] rounded-2xl p-6"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let allCharacters = [];
        let activityChart = null;

        const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

        function formatDate(str) {
            if (!str) return '—';
            const d = new Date(str);
            return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
        }

        function processData(raw) {
            const chars = raw.characters || [];
            const det = raw.detailedChats || {};
            const map = {};

            chars.forEach(c => map[c.character_id] = {...c, totalMessages: 0, chats: []});

            let totalMsg = 0;
            Object.keys(det).forEach(id => {
                if (!map[id]) return;
                (det[id].chats || []).forEach(ch => {
                    const m = ch.chat_count || 0;
                    map[id].totalMessages += m;
                    totalMsg += m;
                    map[id].chats.push({
                        date: ch.updated_at,
                        messages: m,
                        persona: ch.personas?.[0]?.name || 'Unknown'
                    });
                });
            });

            return {
                characters: Object.values(map),
                totalCharacters: chars.length,
                totalThreads: chars.reduce((s,c) => s + (c.chat_count||0), 0),
                totalMessages: totalMsg,
                detailedCount: Object.keys(det).length
            };
        }

        async function handleFileUpload(e) {
            const f = e.target.files[0];
            if (!f) return;
            const up = document.getElementById('upload-section');
            const db = document.getElementById('dashboard');

            up.innerHTML = `<div class="text-center py-12"><i class="fa-spin fa-solid fa-spinner text-4xl text-[#00f9ff]"></i></div>`;

            const text = await f.text();
            const raw = JSON.parse(text);
            currentData = processData(raw);
            allCharacters = currentData.characters;

            updateStats();
            renderTop();
            renderActivity(raw);

            up.style.display = 'none';
            db.classList.remove('hidden');
        }

        function updateStats() {
            const d = currentData;
            document.getElementById('stat-characters').textContent = d.totalCharacters;
            document.getElementById('stat-threads').textContent = d.totalThreads;
            document.getElementById('stat-messages').textContent = d.totalMessages;
            document.getElementById('stat-detailed').textContent = d.detailedCount;
        }

        function renderTop() {
            const sorted = [...currentData.characters].sort((a,b)=>b.totalMessages-a.totalMessages).slice(0,8);
            const c1 = document.getElementById('top-characters');
            c1.innerHTML = '';
            sorted.forEach((c,i) => {
                const d = document.createElement('div');
                d.className = 'flex justify-between px-3 py-2 rounded hover:bg-[#1a1a1a] cursor-pointer';
                d.innerHTML = `<div class="flex gap-x-3"><span class="text-xs text-[#666] w-5">${i+1}</span><span>${c.name}</span></div><span class="font-semibold text-[#00f9ff]">${c.totalMessages}</span>`;
                d.onclick = () => showModal(c);
                c1.appendChild(d);
            });

            const pMap = {};
            currentData.characters.forEach(c => c.chats.forEach(ch => pMap[ch.persona] = (pMap[ch.persona]||0) + ch.messages));
            const topP = Object.entries(pMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
            const c2 = document.getElementById('top-personas');
            c2.innerHTML = '';
            topP.forEach(([n,c]) => {
                const d = document.createElement('div');
                d.className = 'flex justify-between px-3 py-2';
                d.innerHTML = `<span>${n}</span><span class="font-semibold text-emerald-400">${c}</span>`;
                c2.appendChild(d);
            });
        }

        function renderActivity(raw) {
            const monthly = {};
            if (raw.detailedChats) {
                Object.values(raw.detailedChats).forEach(d => {
                    (d.chats||[]).forEach(ch => {
                        if (ch.updated_at) {
                            const m = ch.updated_at.substring(0,7);
                            monthly[m] = (monthly[m]||0) + (ch.chat_count||0);
                        }
                    });
                });
            }
            const labels = Object.keys(monthly).sort();
            const values = labels.map(k => monthly[k]);

            const ctx = document.getElementById('activity-chart');
            if (activityChart) activityChart.destroy();
            activityChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ data: values, borderColor: '#00f9ff', borderWidth: 2, tension: 0.3, fill: true, backgroundColor: 'rgba(0,249,255,0.1)' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: {legend:{display:false}}, scales: { y:{beginAtZero:true, grid:{color:'#222'}}, x:{grid:{color:'#222'}} } }
            });
        }

        function showModal(char) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').innerHTML = char.name;

            const sorted = [...char.chats].sort((a,b) => new Date(a.date) - new Date(b.date));

            document.getElementById('modal-threads').textContent = sorted.length;
            document.getElementById('modal-messages').textContent = char.totalMessages;
            document.getElementById('modal-first').textContent = formatDate(sorted[0]?.date);
            document.getElementById('modal-last').textContent = formatDate(sorted[sorted.length-1]?.date);

            // Visual Tree
            const container = document.getElementById('visual-tree');
            container.innerHTML = '';

            sorted.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'timeline-item flex items-start gap-x-4';

                item.innerHTML = `
                    <div class="timeline-dot"></div>
                    <div class="flex-1">
                        <div class="flex items-center gap-x-3">
                            <div class="font-mono text-sm text-[#888] w-28">${formatDate(ch.date)}</div>
                            <div class="timeline-branch flex-1 flex items-center justify-between bg-[#1a1a1a] px-4 py-2 rounded border border-[#333]">
                                <div>
                                    <span class="font-semibold text-[#00f9ff]">${ch.persona}</span>
                                </div>
                                <div class="font-semibold text-right">${ch.messages} <span class="text-xs text-[#666]">сообщ.</span></div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const m = document.getElementById('modal');
            m.classList.remove('flex');
            m.classList.add('hidden');
        }

        function filterCharacters() {
            const term = document.getElementById('search').value.toLowerCase();
            const cont = document.getElementById('characters-list');
            cont.innerHTML = '';
            allCharacters.filter(c => c.name.toLowerCase().includes(term)).forEach(c => {
                const d = document.createElement('div');
                d.className = 'flex justify-between px-4 py-3 border-b border-[#222] cursor-pointer hover:bg-[#1a1a1a]';
                d.innerHTML = `<div><div class="font-medium">${c.name}</div><div class="text-xs text-[#666]">${c.chats.length} тредов • ${c.totalMessages} сообщ.</div></div><i class="fa-solid fa-chevron-right text-[#555]"></i>`;
                d.onclick = () => showModal(c);
                cont.appendChild(d);
            });
        }

        window.onload = () => console.log('%c[WILD TOURISTS] Visual tree version ready', 'color:#00f9ff');
    </script>
</body>
</html>
